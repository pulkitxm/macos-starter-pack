name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint
        run: make lint
      - name: No comments
        run: make comments
      - name: Test
        run: make test
      - name: Build, verify, and package the release app
        run: make dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Import a throwaway identity the way releases do
        run: |
          scripts/signing.sh create "CI Throwaway"
          MACOS_CERT_P12="$(base64 < .signing/identity.p12)"
          MACOS_CERT_PASSWORD="$(cat .signing/password)"
          export MACOS_CERT_P12 MACOS_CERT_PASSWORD
          scripts/signing.sh reset
          scripts/signing.sh ci-import
      - name: Build and package with the imported identity
        run: |
          make dmg
          codesign -dvv dist/*.app 2>&1 | grep -qx 'Authority=CI Throwaway'
          codesign -dvv dist/*.dmg 2>&1 | grep -qx 'Authority=CI Throwaway'
